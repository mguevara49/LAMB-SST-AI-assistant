</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lightweight inline SVG icons replacement to ensure zero-dependency reliability on GitHub Pages

        edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />,
        paperclip: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        save: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />,
        printer: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />,
        presentation: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || icons.sparkles}
        </svg>
      );
    };

    const INITIAL_STUDENTS = [
      {
        id: 'lamb-001',
        name: 'Mateo Hernández-Reyes',
        grade: 'Lower Elementary (Grade 2)',
        planType: 'IEP',
        dob: '2018-04-12',
        primaryLanguage: 'Spanish (Home) / English & Spanish (Dual Immersion)',
        disabilityCategory: 'Specific Learning Disability (Phonemic Decoding)',
        caseManager: 'Maestra Elena Soto',
        generalTeacher: 'Guide Carlos Morales',
        montessoriCycle: 'Taller I (Lower Elementary 6-9)',
        annualReviewDate: '2027-03-09',
        summaryEn: 'Mateo is an inquisitive, empathetic learner who demonstrates high mathematical reasoning with concrete Montessori bead chains and Stamp Game. Struggles with dual-language decoding in both English and Spanish, exhibiting letter reversals and phonetic fatigue during independent Great Lessons follow-up work.',
        summaryEs: 'Mateo es un estudiante curioso y empático que demuestra un alto razonamiento matemático con las cadenas de perlas Montessori y el juego de estampillas. Presenta dificultades con la decodificación bilingüe en inglés y español, manifestando inversiones y fatiga fonética durante el trabajo independiente de las Grandes Lecciones.',
        documents: [
          { name: 'Mateo_Bilingual_PsychEval_2025.pdf', size: '245 KB', uploadDate: '2026-02-14' },
          { name: 'TRC_Spanish_Reading_Screenshot.png', size: '180 KB', uploadDate: '2026-03-01' }
        ],
        accommodations: [
          'Dual-language graphic organizers with pictorial cues (Organigramas bilingües con apoyos visuales)',
          'Sensorial phonics materials: Sandpaper letters (Letras de lija) & Moveable Alphabet (Alfabeto móvil)',
          'Frequent movement breaks to the Peace Corner / Walking on the Line for regulation',
          'Extended time (1.5x) for bilingual literacy assessments in English and Spanish'
        ],
        goals: [
          {
            id: 'g-1',
            area: 'Bilingual Literacy & Phonemic Awareness',
            goalEn: 'Given phonetic reading cards and the Moveable Alphabet in both languages, Mateo will decode 2-syllable Spanish words and English CVCe words with 80% accuracy across 4 consecutive trials.',
            goalEs: 'Utilizando tarjetas de lectura fonética y el Alfabeto Móvil en ambos idiomas, Mateo decodificará palabras de dos sílabas en español y palabras CVCe en inglés con un 80% de precisión en 4 sesiones consecutivas.',
            baseline: '52% in Spanish decoding, 44% in English phonics',
            targetDate: '2027-02-15',
            montessoriTool: 'Sandpaper Letters & Large Moveable Alphabet'
          }
        ],
        trackingData: [
          { date: '2026-09-15', trial: 'Trial 1 - Spanish Decod.', score: 58, notes: 'Benefited from finger tracing sandpaper letters' },
          { date: '2026-09-22', trial: 'Trial 2 - English CVCe', score: 62, notes: 'Used Moveable Alphabet beads effectively' },
          { date: '2026-09-29', trial: 'Trial 3 - Dual Reading', score: 70, notes: 'High engagement during paired partner reading' },
          { date: '2026-10-06', trial: 'Trial 4 - Self-Directed Work', score: 75, notes: 'Completed Math Stamp game independently' }
        ]
      },
      {
        id: 'lamb-002',
        name: 'Sofia Alarcón Cruz',
        grade: 'Children’s House (Kindergarten)',
        planType: '504',
        dob: '2020-09-18',
        primaryLanguage: 'English & Spanish (Simultaneous Bilingual)',
        disabilityCategory: 'ADHD (Inattentive Type) & Sensory Modulation',
        caseManager: 'Guide Mariana Vega',
        generalTeacher: 'Guide Mariana Vega',
        montessoriCycle: 'Casa dei Bambini (Primary 3-6)',
        annualReviewDate: '2027-04-12',
        summaryEn: 'Sofia is an imaginative and socially warm student in Casa. She shows sensory seeking behaviors during group circles and transitions between Montessori practical life shelves. She thrives when utilizing heavy-work activities before tabletop lessons.',
        summaryEs: 'Sofía es una estudiante imaginativa y muy sociable en Casa dei Bambini. Manifiesta conductas de búsqueda sensorial durante los círculos grupales y transiciones en las repisas de vida práctica.',
        documents: [
          { name: 'Pediatric_Sensory_Evaluation.pdf', size: '310 KB', uploadDate: '2026-04-10' }
        ],
        accommodations: [
          'Access to wobble stool and floor work rugs with defined boundaries',
          'Heavy-work practical life tasks (carrying water pitchers, scrubbing cloths) prior to focused lessons',
          'Visual timer for three-period Montessori lessons'
        ],
        goals: [
          {
            id: 'g-3',
            area: 'Sensory Regulation & Circle Time',
            goalEn: 'Sofia will remain regulated and seated on her Montessori rug during 15-minute bilingual community circles using a sensory cushion with zero disruptions for 4 out of 5 consecutive days.',
            goalEs: 'Sofía se mantendrá autorregulada y sentada en su alfombra individual durante los círculos comunitarios bilingües de 15 minutos usando un cojín sensorial sin interrupciones.',
            baseline: '5-7 minutes sustained attention before leaving rug',
            targetDate: '2027-03-30',
            montessoriTool: 'Sensory Textured Floor Mat'
          }
        ],
        trackingData: [
          { date: '2026-09-12', trial: 'Circle Time Day 1', score: 60, notes: 'Used tactile breathing pebble' },
          { date: '2026-09-19', trial: 'Circle Time Day 2', score: 65, notes: 'Carried rugs before gathering' }
        ]
      }
    ];

    function App() {
      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem('lamb_students_data_live');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.warn('LocalStorage load error:', e);
        }
        return INITIAL_STUDENTS;
      });

      const [selectedStudentId, setSelectedStudentId] = useState(() => students[0]?.id || 'lamb-001');
      const [activeTab, setActiveTab] = useState('intake');
      const [currentLang, setCurrentLang] = useState('dual');
      const [toastMessage, setToastMessage] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      // Intake Fields
      const [intakeStudentName, setIntakeStudentName] = useState('');
      const [intakePlanType, setIntakePlanType] = useState('IEP');
      const [intakeGrade, setIntakeGrade] = useState('Lower Elementary (Grade 2)');
      const [pastedNotes, setPastedNotes] = useState('');
      const [intakeMode, setIntakeMode] = useState('new');

      // Modals
      const [showStudentModal, setShowStudentModal] = useState(false);
      const [isEditingExisting, setIsEditingExisting] = useState(false);
      const [studentFormData, setStudentFormData] = useState({
        id: '',
        name: '',
        grade: 'Lower Elementary (Grade 2)',
        planType: 'IEP',
        montessoriCycle: 'Taller I (Lower Elementary 6-9)',
        primaryLanguage: 'Spanish (Home) / English & Spanish (Dual Immersion)',
        disabilityCategory: 'Specific Learning Disability (Phonemic Decoding)',
        caseManager: 'Maestra Soto',
        annualReviewDate: '2027-04-15',
        documents: []
      });
      const [modalPendingFiles, setModalPendingFiles] = useState([]);

      // In-place PLAAFP editing
      const [isEditingSummary, setIsEditingSummary] = useState(false);
      const [editableSummaryEn, setEditableSummaryEn] = useState('');
      const [editableSummaryEs, setEditableSummaryEs] = useState('');

      const activeStudent = students.find(s => s.id === selectedStudentId) || students[0] || INITIAL_STUDENTS[0];

      useEffect(() => {
        try {
          localStorage.setItem('lamb_students_data_live', JSON.stringify(students));
        } catch (e) {
          console.warn('Storage save failed:', e);
        }
      }, [students]);

      useEffect(() => {
        if (activeStudent) {
          setEditableSummaryEn(activeStudent.summaryEn || '');
          setEditableSummaryEs(activeStudent.summaryEs || '');
          setIsEditingSummary(false);
        }
      }, [selectedStudentId, activeStudent]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const openAddStudentModal = () => {
        setIsEditingExisting(false);
        setModalPendingFiles([]);
        setStudentFormData({
          id: `lamb-${Date.now()}`,
          name: '',
          grade: 'Lower Elementary (Grade 2)',
          planType: 'IEP',
          montessoriCycle: 'Taller I (Lower Elementary 6-9)',
          primaryLanguage: 'Spanish (Home) / English & Spanish (Dual Immersion)',
          disabilityCategory: 'Specific Learning Disability',
          caseManager: 'Assigned Guide',
          annualReviewDate: '2027-04-15',
          documents: []
        });
        setShowStudentModal(true);
      };

      const openEditStudentModal = (st) => {
        setIsEditingExisting(true);
        setModalPendingFiles([]);
        setStudentFormData({ ...st, documents: st.documents || [] });
        setShowStudentModal(true);
      };

      const handleModalFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        const newUploaded = files.map(f => ({
          name: f.name,
          size: (f.size / 1024).toFixed(1) + ' KB',
          uploadDate: new Date().toISOString().split('T')[0]
        }));
        setModalPendingFiles(prev => [...prev, ...newUploaded]);
        showToast(`Attached ${files.length} document(s)`);
      };

      const saveStudentForm = () => {
        if (!studentFormData.name.trim()) {
          showToast('Please enter student full name');
          return;
        }
        const updatedDocs = [...(studentFormData.documents || []), ...modalPendingFiles];

        if (isEditingExisting) {
          setStudents(prev => prev.map(s => s.id === studentFormData.id ? { ...s, ...studentFormData, documents: updatedDocs } : s));
          showToast(`Updated profile for ${studentFormData.name}`);
        } else {
          const newStudent = {
            ...studentFormData,
            id: `lamb-${Date.now()}`,
            documents: updatedDocs,
            summaryEn: `${studentFormData.name} demonstrates engagement with concrete Montessori materials in ${studentFormData.grade}. Scaffolding is required for bilingual reading fluency and multi-step work cycle completion.`,
            summaryEs: `${studentFormData.name} muestra un buen compromiso con los materiales Montessori en ${studentFormData.grade}. Requiere apoyos específicos para la fluidez lectora bilingüe y el ciclo de trabajo autónomo.`,
            accommodations: [
              'Dual-language graphic organizers with visual cues',
              'Concrete Montessori sensorial materials prior to abstract tasks',
              'Designated Peace Corner self-regulation breaks'
            ],
            goals: [
              {
                id: `g-${Date.now()}`,
                area: 'Bilingual Literacy & Work Cycle',
                goalEn: `Given Montessori phonics cards, ${studentFormData.name} will decode targeted dual-language vocabulary with 80% accuracy.`,
                goalEs: `Utilizando tarjetas fonéticas Montessori, ${studentFormData.name} decodificará palabras bilingües con un 80% de precisión.`,
                baseline: 'Initial baseline in progress',
                targetDate: '2027-04-15',
                montessoriTool: 'Sandpaper Letters & Moveable Alphabet'
              }
            ],
            trackingData: [
              { date: new Date().toISOString().split('T')[0], trial: 'Intake Baseline', score: 60, notes: 'Intake document processed' }
            ]
          };
          setStudents(prev => [newStudent, ...prev]);
          setSelectedStudentId(newStudent.id);
          showToast(`Created ${newStudent.name} with ${updatedDocs.length} attached document(s)!`);
        }
        setShowStudentModal(false);
      };

      const handleIntakeFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        const newUploaded = files.map(f => ({
          name: f.name,
          size: (f.size / 1024).toFixed(1) + ' KB',
          uploadDate: new Date().toISOString().split('T')[0]
        }));

        setStudents(prev => prev.map(s => s.id === activeStudent.id ? { ...s, documents: [...(s.documents || []), ...newUploaded] } : s));
        showToast(`Uploaded ${files.length} document(s) to ${activeStudent.name}`);
      };

      const runAISynthesis = () => {
        setIsAnalyzing(true);
        setTimeout(() => {
          setIsAnalyzing(false);
          const targetName = intakeStudentName.trim() || activeStudent.name;
          const generatedEn = `${targetName} participates actively in the ${intakeGrade} dual-language Montessori environment. Clinical observations and uploaded files show consistent engagement with tactile sensorial apparatus, alongside emerging phonetic decoding in Spanish and English. Benefiting from 3-period lesson sequences and visual work cycle structures.`;
          const generatedEs = `${targetName} participa activamente en el entorno Montessori bilingüe de ${intakeGrade}. Las observaciones y los documentos cargados muestran entusiasmo con el material sensorial y decodificación fonética emergente en inglés y español. Se beneficia de lecciones de tres períodos y organizadores visuales.`;

          if (intakeMode === 'new' && intakeStudentName.trim()) {
            const newStudent = {
              id: `lamb-${Date.now()}`,
              name: targetName,
              grade: intakeGrade,
              planType: intakePlanType,
              montessoriCycle: intakeGrade.includes('Casa') ? 'Casa dei Bambini (Primary 3-6)' : 'Taller I (Lower Elementary 6-9)',
              primaryLanguage: 'Spanish (Home) / English & Spanish (Dual Immersion)',
              disabilityCategory: 'Specific Learning Disability / Speech & Language',
              caseManager: 'Guide Soto',
              annualReviewDate: '2027-04-15',
              documents: [],
              summaryEn: generatedEn,
              summaryEs: generatedEs,
              accommodations: [
                'Dual-language graphic organizers with visual cues',
                'Sandpaper letters & Moveable Alphabet',
                'Peace Corner regulation breaks'
              ],
              goals: [
                {
                  id: `g-${Date.now()}`,
                  area: 'Bilingual Phonemic Awareness',
                  goalEn: `Given Moveable Alphabet and cards, ${targetName} will decode 2-syllable bilingual words with 80% accuracy across 4 trials.`,
                  goalEs: `Con el Alfabeto Móvil y tarjetas, ${targetName} decodificará palabras de dos sílabas con 80% de precisión en 4 sesiones.`,
                  baseline: '50% baseline accuracy',
                  targetDate: '2027-04-15',
                  montessoriTool: 'Sandpaper Letters & Moveable Alphabet'
                }
              ],
              trackingData: [
                { date: new Date().toISOString().split('T')[0], trial: 'Intake Trial 1', score: 62, notes: pastedNotes ? pastedNotes.slice(0, 50) + '...' : 'Intake observation' }
              ]
            };
            setStudents(prev => [newStudent, ...prev]);
            setSelectedStudentId(newStudent.id);
            setActiveTab('summary');
            showToast(`Created ${newStudent.name} and generated bilingual IEP!`);
          } else {
            setStudents(prev => prev.map(s => s.id === activeStudent.id ? { ...s, summaryEn: generatedEn, summaryEs: generatedEs } : s));
            setActiveTab('summary');
            showToast(`Updated summaries for ${activeStudent.name}!`);
          }
        }, 1200);
      };

      const copyGoogleDocs = () => {
        const text = `
LATIN AMERICAN MONTESSORI BILINGUAL (LAMB) PCS
IEP / 504 BILINGUAL ACADEMIC REPORT
STUDENT: ${activeStudent.name} | GRADE: ${activeStudent.grade} | PLAN: ${activeStudent.planType}

PRESENT LEVELS OF PERFORMANCE (ENGLISH):
${activeStudent.summaryEn}

RESUMEN EN ESPAÑOL (PARA FAMILIAS):
${activeStudent.summaryEs}

ACCOMMODATIONS:
${(activeStudent.accommodations || []).map((a, i) => `${i + 1}. ${a}`).join('\n')}
        `.trim();
        
        navigator.clipboard.writeText(text);
        showToast('Copied formatted IEP text for Google Docs!');
      };

      const exportCSV = () => {
        let csv = 'Student,Plan,Grade,Date,Trial,Score,Notes\n';
        (activeStudent.trackingData || []).forEach(r => {
          csv += `"${activeStudent.name}","${activeStudent.planType}","${activeStudent.grade}","${r.date}","${r.trial}",${r.score},"${(r.notes || '').replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeStudent.name.replace(/\s+/g, '_')}_Progress_Data.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Downloaded Google Sheets / CSV file!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 text-xs border border-emerald-500/50">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Navigation Bar */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-white text-lg shadow-md">
                  L
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-base font-bold tracking-tight">LAMB Bilingual IEP & 504 AI Assistant</h1>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30">
                      Montessori Prepared
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Latin American Montessori Bilingual PCS &bull; Washington, D.C.</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={openAddStudentModal}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl text-xs shadow-md transition"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>+ Add Student</span>
                </button>

                <div className="flex items-center bg-slate-800 rounded-xl px-3 py-1.5 border border-slate-700 text-xs">
                  <span className="text-slate-400 mr-2">Estudiante:</span>
                  <select 
                    value={selectedStudentId} 
                    onChange={(e) => {
                      if (e.target.value === '__add__') openAddStudentModal();
                      else setSelectedStudentId(e.target.value);
                    }}
                    className="bg-transparent text-white font-medium focus:outline-none cursor-pointer"
                  >
                    {students.map(s => (
                      <option key={s.id} value={s.id} className="bg-slate-900 text-white">
                        {s.name} ({s.planType})
                      </option>
                    ))}
                    <option value="__add__" className="bg-slate-900 text-amber-300 font-bold">+ Add New Student...</option>
                  </select>
                </div>

                <div className="bg-slate-800 p-1 rounded-xl flex items-center border border-slate-700 text-xs">
                  <button onClick={() => setCurrentLang('dual')} className={`px-2.5 py-1 rounded-lg ${currentLang === 'dual' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>Dual</button>
                  <button onClick={() => setCurrentLang('en')} className={`px-2 py-1 rounded-lg ${currentLang === 'en' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>EN</button>
                  <button onClick={() => setCurrentLang('es')} className={`px-2 py-1 rounded-lg ${currentLang === 'es' ? 'bg-emerald-600 text-white' : 'text-slate-300'}`}>ES</button>
                </div>

                <button onClick={() => window.print()} className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition" title="Print view">
                  <Icon name="printer" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Tab navigation */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto text-xs font-semibold pt-1 border-t border-slate-800">
              {[
                { id: 'intake', label: '1. Intake & Records', icon: 'upload' },
                { id: 'summary', label: '2. Bilingual PLAAFP', icon: 'book' },
                { id: 'goals', label: '3. Montessori Goals', icon: 'compass' },
                { id: 'tracking', label: '4. Progress Monitor', icon: 'chart' },
                { id: 'google', label: '5. Google Suite Export', icon: 'share' },
                { id: 'caseload', label: `6. Caseload (${students.length})`, icon: 'layers' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-2.5 px-4 rounded-t-xl transition-all flex items-center gap-2 border-b-2 ${
                    activeTab === tab.id ? 'border-emerald-400 text-emerald-400 bg-slate-800/60' : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icon name={tab.icon} className="w-3.5 h-3.5" />
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </header>

          {/* Active Student Header Bar */}
          <main className="max-w-7xl mx-auto w-full px-4 py-6 flex-1">
            <div className="bg-white rounded-2xl p-4 mb-6 border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-lg border border-emerald-200">
                  {activeStudent.name.charAt(0)}
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h2 className="text-lg font-bold text-slate-900">{activeStudent.name}</h2>
                    <span className="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-800 border border-amber-300">
                      {activeStudent.planType} Plan
                    </span>
                    <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">
                      {activeStudent.montessoriCycle}
                    </span>
                    <button
                      onClick={() => openEditStudentModal(activeStudent)}
                      className="px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium flex items-center gap-1 border border-slate-300"
                    >
                      <Icon name="edit" className="w-3 h-3 text-emerald-600" />
                      <span>Edit Student</span>
                    </button>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Guide: <strong>{activeStudent.caseManager}</strong> &bull; Language: <strong>{activeStudent.primaryLanguage}</strong> &bull; Review: <strong>{activeStudent.annualReviewDate}</strong>
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs bg-emerald-50 text-emerald-800 px-3 py-1 rounded-xl font-medium border border-emerald-200 flex items-center gap-1.5">
                  <Icon name="paperclip" className="w-3.5 h-3.5 text-emerald-600" />
                  {(activeStudent.documents || []).length} Attached Records
                </span>
              </div>
            </div>

            {/* TAB 1: INTAKE */}
            {activeTab === 'intake' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-6 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2 mb-3">
                      <Icon name="upload" className="w-5 h-5 text-emerald-600" />
                      <span>Upload Documents, Screenshots & Records</span>
                    </h3>
                    <label className="border-2 border-dashed border-emerald-300 hover:border-emerald-500 bg-emerald-50/40 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer text-center group transition">
                      <Icon name="upload" className="w-8 h-8 text-emerald-600 mb-2 group-hover:scale-110 transition" />
                      <span className="text-sm font-semibold text-slate-800">Click to browse or drop screenshots / PDFs</span>
                      <span className="text-xs text-slate-500 mt-1">Accepts PNG, JPG, PDF, TXT (Attaches to {activeStudent.name})</span>
                      <input type="file" multiple onChange={handleIntakeFileUpload} className="hidden" accept="image/*,.pdf,.txt,.doc" />
                    </label>

                    <div className="mt-4">
                      <h4 className="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                        Attached Files ({(activeStudent.documents || []).length})
                      </h4>
                      <div className="space-y-2 max-h-48 overflow-y-auto">
                        {(activeStudent.documents || []).map((file, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                            <span className="font-semibold text-slate-800 truncate">{file.name}</span>
                            <span className="text-slate-400 text-[10px]">{file.size}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Direct Observations Box */}
                <div className="lg:col-span-6 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <Icon name="fileText" className="w-5 h-5 text-teal-600" />
                        <span>Montessori Work Cycle Notes</span>
                      </h3>
                      <div className="flex items-center bg-slate-100 p-0.5 rounded-xl text-xs">
                        <button onClick={() => setIntakeMode('new')} className={`px-2.5 py-1 rounded-lg font-semibold ${intakeMode === 'new' ? 'bg-white shadow text-emerald-800' : 'text-slate-500'}`}>+ New Student</button>
                        <button onClick={() => setIntakeMode('update_current')} className={`px-2.5 py-1 rounded-lg font-semibold ${intakeMode === 'update_current' ? 'bg-white shadow text-emerald-800' : 'text-slate-500'}`}>Update Current</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-3 text-xs">
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">{intakeMode === 'new' ? 'New Student Full Name *' : 'Student Name'}</label>
                        <input 
                          type="text" 
                          value={intakeStudentName} 
                          placeholder={intakeMode === 'new' ? 'e.g. Lucia Gomez' : activeStudent.name}
                          onChange={(e) => setIntakeStudentName(e.target.value)} 
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Plan Type</label>
                        <select value={intakePlanType} onChange={(e) => setIntakePlanType(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800">
                          <option value="IEP">IEP</option>
                          <option value="504">504 Plan</option>
                          <option value="MTSS">Tier 2/3 MTSS</option>
                        </select>
                      </div>
                    </div>

                    <div className="mb-3 text-xs">
                      <label className="block font-semibold text-slate-700 mb-1">Montessori Cycle</label>
                      <select value={intakeGrade} onChange={(e) => setIntakeGrade(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800">
                        <option value="Children’s House (Kindergarten)">Casa dei Bambini (Primary 3-6)</option>
                        <option value="Lower Elementary (Grade 2)">Taller I (Lower Elementary 6-9)</option>
                        <option value="Upper Elementary (Grade 4)">Taller II (Upper Elementary 9-12)</option>
                      </select>
                    </div>

                    <div className="mb-4 text-xs">
                      <label className="block font-semibold text-slate-700 mb-1">Teacher Notes / TRC / DIBELS Observation</label>
                      <textarea 
                        rows={5} 
                        value={pastedNotes} 
                        onChange={(e) => setPastedNotes(e.target.value)}
                        placeholder="Paste work cycle observations, reading assessments, or behavior triggers here..." 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none"
                      />
                    </div>
                  </div>

                  <button 
                    disabled={isAnalyzing} 
                    onClick={runAISynthesis} 
                    className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2"
                  >
                    {isAnalyzing ? <Icon name="refresh" className="w-4 h-4 animate-spin" /> : <Icon name="sparkles" className="w-4 h-4 text-amber-300" />}
                    <span>{isAnalyzing ? 'Synthesizing with AI...' : (intakeMode === 'new' ? 'Create Student & Synthesize Plan' : 'Update Summaries')}</span>
                  </button>
                </div>
              </div>
            )}

            {/* TAB 2: PLAAFP SUMMARY */}
            {activeTab === 'summary' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4 mb-4">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <Icon name="book" className="w-5 h-5 text-emerald-600" />
                        <span>Present Levels of Academic & Functional Performance (PLAAFP)</span>
                      </h3>
                      <p className="text-xs text-slate-500">Bilingual synthesis for {activeStudent.name}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={copyGoogleDocs} className="px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                        <Icon name="copy" className="w-3.5 h-3.5" /> Copy for Google Docs
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                    {(currentLang === 'dual' || currentLang === 'en') && (
                      <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <span className="font-bold uppercase tracking-wider text-slate-700 block mb-2">English PLAAFP Summary</span>
                        <p className="text-slate-700 leading-relaxed whitespace-pre-line">{activeStudent.summaryEn}</p>
                      </div>
                    )}
                    {(currentLang === 'dual' || currentLang === 'es') && (
                      <div className="bg-amber-50/50 p-5 rounded-2xl border border-amber-200">
                        <span className="font-bold uppercase tracking-wider text-amber-900 block mb-2">Resumen en Español (Para Familias)</span>
                        <p className="text-slate-700 leading-relaxed whitespace-pre-line">{activeStudent.summaryEs}</p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <h4 className="text-base font-bold text-slate-900 mb-3">Accommodations & Montessori Classroom Scaffolding</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {(activeStudent.accommodations || []).map((acc, i) => (
                      <div key={i} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs flex items-start gap-2">
                        <span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center shrink-0 text-[10px]">{i + 1}</span>
                        <span className="text-slate-700">{acc}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: GOALS */}
            {activeTab === 'goals' && (
              <div className="space-y-4">
                {(activeStudent.goals || []).map((goal, idx) => (
                  <div key={goal.id || idx} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                    <h4 className="font-bold text-slate-900 text-sm mb-2">{idx + 1}. {goal.area}</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs mb-3">
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <strong>English SMART Goal:</strong>
                        <p className="mt-1 text-slate-700">{goal.goalEn}</p>
                      </div>
                      <div className="p-3 bg-amber-50/50 rounded-xl border border-amber-200">
                        <strong>Meta en Español:</strong>
                        <p className="mt-1 text-slate-700">{goal.goalEs}</p>
                      </div>
                    </div>
                    <div className="text-xs text-slate-500">
                      Montessori Apparatus: <strong className="text-slate-800">{goal.montessoriTool}</strong> &bull; Baseline: {goal.baseline}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 4: PROGRESS TRACKER */}
            {activeTab === 'tracking' && (
              <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-900">Quantitative Progress Trials</h3>
                  <button onClick={exportCSV} className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow">
                    <Icon name="download" className="w-3.5 h-3.5" /> Export Google Sheets CSV
                  </button>
                </div>
                <div className="space-y-3">
                  {(activeStudent.trackingData || []).map((t, idx) => (
                    <div key={idx} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <div className="flex justify-between font-semibold text-slate-700 mb-1">
                        <span>{t.trial} ({t.date})</span>
                        <span className="font-bold text-emerald-700">{t.score}%</span>
                      </div>
                      <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden mb-1">
                        <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(t.score, 100)}%` }}></div>
                      </div>
                      <span className="text-[11px] text-slate-500 italic">{t.notes}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: GOOGLE EXPORT */}
            {activeTab === 'google' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="p-5 rounded-2xl bg-blue-50/50 border border-blue-200 flex flex-col justify-between">
                  <div>
                    <Icon name="fileText" className="w-8 h-8 text-blue-600 mb-2" />
                    <h4 className="font-bold text-slate-900 mb-1">Google Docs</h4>
                    <p className="text-xs text-slate-600 mb-4">Copy clean bilingual summary formatted for pasting straight into Google Docs.</p>
                  </div>
                  <button onClick={copyGoogleDocs} className="py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow">
                    Copy for Google Docs
                  </button>
                </div>

                <div className="p-5 rounded-2xl bg-emerald-50/50 border border-emerald-200 flex flex-col justify-between">
                  <div>
                    <Icon name="chart" className="w-8 h-8 text-emerald-600 mb-2" />
                    <h4 className="font-bold text-slate-900 mb-1">Google Sheets</h4>
                    <p className="text-xs text-slate-600 mb-4">Download CSV formatted data to build charts in Google Sheets.</p>
                  </div>
                  <button onClick={exportCSV} className="py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">
                    Download Sheets CSV
                  </button>
                </div>

                <div className="p-5 rounded-2xl bg-amber-50/50 border border-amber-200 flex flex-col justify-between">
                  <div>
                    <Icon name="presentation" className="w-8 h-8 text-amber-600 mb-2" />
                    <h4 className="font-bold text-slate-900 mb-1">Google Slides</h4>
                    <p className="text-xs text-slate-600 mb-4">Copy a 5-slide outline for IEP conferences and reviews.</p>
                  </div>
                  <button onClick={() => {
                    navigator.clipboard.writeText(`SLIDE 1: ${activeStudent.name} IEP Review\nSLIDE 2: Montessori Strengths\nSLIDE 3: PLAAFP\nSLIDE 4: Accommodations\nSLIDE 5: Bilingual Goals`);
                    showToast('Copied Google Slides presentation outline!');
                  }} className="py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow">
                    Copy Slides Outline
                  </button>
                </div>
              </div>
            )}

            {/* TAB 6: CASELOAD */}
            {activeTab === 'caseload' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="font-bold text-slate-900">Active Caseload Roster</h3>
                  <button onClick={openAddStudentModal} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">
                    + Add New Student
                  </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {students.map(s => (
                    <div key={s.id} onClick={() => setSelectedStudentId(s.id)} className={`p-4 rounded-2xl border cursor-pointer transition ${s.id === selectedStudentId ? 'border-emerald-500 bg-emerald-50/30 shadow' : 'border-slate-200 bg-white'}`}>
                      <div className="flex justify-between items-center mb-1">
                        <span className="font-bold text-slate-900">{s.name}</span>
                        <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100">{s.planType}</span>
                      </div>
                      <p className="text-xs text-slate-500">{s.grade} &bull; {(s.documents || []).length} Attached Documents</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Student Add/Edit Modal */}
          {showStudentModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl p-6 max-w-xl w-full shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                  <h3 className="font-bold text-slate-900">{isEditingExisting ? `Edit: ${studentFormData.name}` : 'Add New Student with Existing Files'}</h3>
                  <button onClick={() => setShowStudentModal(false)}><Icon name="close" className="w-5 h-5 text-slate-400" /></button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Student Full Name *</label>
                    <input type="text" value={studentFormData.name} onChange={(e) => setStudentFormData({ ...studentFormData, name: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-900 outline-none" placeholder="e.g. Mateo Hernández" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Plan Type</label>
                      <select value={studentFormData.planType} onChange={(e) => setStudentFormData({ ...studentFormData, planType: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <option value="IEP">IEP</option>
                        <option value="504">504</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cycle</label>
                      <select value={studentFormData.montessoriCycle} onChange={(e) => setStudentFormData({ ...studentFormData, montessoriCycle: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <option value="Casa dei Bambini (Primary 3-6)">Casa dei Bambini (Primary 3-6)</option>
                        <option value="Taller I (Lower Elementary 6-9)">Taller I (Lower Elementary 6-9)</option>
                        <option value="Taller II (Upper Elementary 9-12)">Taller II (Upper Elementary 9-12)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Upload Existing Records / Files</label>
                    <input type="file" multiple onChange={handleModalFileUpload} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                  </div>
                </div>

                <div className="mt-5 flex justify-end gap-2 border-t border-slate-100 pt-3">
                  <button onClick={() => setShowStudentModal(false)} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600">Cancel</button>
                  <button onClick={saveStudentForm} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">Save Student</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
            Latin American Montessori Bilingual (LAMB) PCS &bull; Dual-Language Special Education & Student Support Services
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
